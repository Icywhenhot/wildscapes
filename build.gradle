plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.149'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel', '**/.cache/**')
}

repositories {
    mavenLocal {
        content { includeGroup 'icy.lib' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/neo263-client')
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/neo263-server')
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/neo263-tests')
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    interfaceInjectionData {
        from(provider {
            zipTree(configurations.geckolibInjections.singleFile).matching { include 'META-INF/interface_injections.json' }
        })
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    geckolibInjections {
        canBeConsumed = false
        transitive = false
    }
}

def guideJar = file(providers.gradleProperty('icys_lib_jar').getOrElse(
        "../Icy's lib/build/libs/icys_lib-neoforge-${minecraft_version}-${icys_lib_version}.jar"))

dependencies {
    implementation "maven.modrinth:geckolib:${geckolib_version}"
    geckolibInjections "maven.modrinth:geckolib:${geckolib_version}"
    if (guideJar.isFile()) {
        implementation files(guideJar)
    } else {
        implementation "icy.lib:icys_lib-neoforge-${minecraft_version}:${icys_lib_version}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            icys_lib_version       : icys_lib_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
